name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          envs: MONGO_ROOT_USERNAME,MONGO_ROOT_PASSWORD,MONGO_DATABASE,MONGO_HOST,MONGO_PORT,MONGO_REPLICA_SET_NAME,MONGO_REPLICA_SET_KEY,JWT_SECRET,PORT,CLIENT_URL,SWAGGER_ENABLED,AUTH_ACCESS_COOKIE_NAME,AUTH_REFRESH_COOKIE_NAME,AUTH_ACCESS_COOKIE_PATH,AUTH_REFRESH_COOKIE_PATH,AUTH_CSRF_SECRET,AUTH_CSRF_COOKIE_NAME,AUTH_CSRF_COOKIE_PATH,AUTH_CSRF_BINDING_COOKIE_NAME,AUTH_CSRF_BINDING_COOKIE_PATH,AUTH_CSRF_HEADER_NAME,AUTH_COOKIE_SAMESITE,AUTH_COOKIE_SECURE,AUDIT_TRANSACTIONAL_OUTBOX,AUDIT_OUTBOX_POLL_INTERVAL_MS,AUDIT_OUTBOX_LOCK_TIMEOUT_MS,AUDIT_OUTBOX_MAX_ATTEMPTS,DB_MIGRATIONS_ENABLED,DB_MIGRATION_LOCK_TTL_MS,DB_MIGRATION_WAIT_TIMEOUT_MS,DB_MIGRATION_POLL_INTERVAL_MS
          script: |
            cd /opt/online_campus
            git pull origin master

            sanitize_env_value() {
              printf '%s' "$1" | tr -d '\r\n'
            }

            write_required_env() {
              key="$1"
              value="$(sanitize_env_value "$2")"
              if [ -z "$value" ]; then
                echo "Missing required environment variable: $key" >&2
                exit 1
              fi
              printf '%s=%s\n' "$key" "$value" >> .env
            }

            append_env() {
              key="$1"
              value="$(sanitize_env_value "$2")"
              if [ -n "$value" ]; then
                printf '%s=%s\n' "$key" "$value" >> .env
              fi
            }

            : > .env
            write_required_env MONGO_ROOT_USERNAME "$MONGO_ROOT_USERNAME"
            write_required_env MONGO_ROOT_PASSWORD "$MONGO_ROOT_PASSWORD"
            write_required_env MONGO_DATABASE "$MONGO_DATABASE"
            write_required_env MONGO_HOST "$MONGO_HOST"
            write_required_env MONGO_PORT "$MONGO_PORT"
            append_env MONGO_REPLICA_SET_NAME "${MONGO_REPLICA_SET_NAME:-rs0}"
            write_required_env MONGO_REPLICA_SET_KEY "$MONGO_REPLICA_SET_KEY"
            write_required_env JWT_SECRET "$JWT_SECRET"
            write_required_env PORT "$PORT"
            write_required_env CLIENT_URL "$CLIENT_URL"
            write_required_env NODE_ENV production
            write_required_env SEED_DEMO_DATA false
            write_required_env SEED_DEMO_DATA_IN_PRODUCTION false
            append_env SWAGGER_ENABLED "$SWAGGER_ENABLED"
            append_env AUTH_ACCESS_COOKIE_NAME "$AUTH_ACCESS_COOKIE_NAME"
            append_env AUTH_REFRESH_COOKIE_NAME "$AUTH_REFRESH_COOKIE_NAME"
            append_env AUTH_ACCESS_COOKIE_PATH "$AUTH_ACCESS_COOKIE_PATH"
            append_env AUTH_REFRESH_COOKIE_PATH "$AUTH_REFRESH_COOKIE_PATH"
            write_required_env AUTH_CSRF_SECRET "$AUTH_CSRF_SECRET"
            append_env AUTH_CSRF_COOKIE_NAME "$AUTH_CSRF_COOKIE_NAME"
            append_env AUTH_CSRF_COOKIE_PATH "$AUTH_CSRF_COOKIE_PATH"
            append_env AUTH_CSRF_BINDING_COOKIE_NAME "$AUTH_CSRF_BINDING_COOKIE_NAME"
            append_env AUTH_CSRF_BINDING_COOKIE_PATH "$AUTH_CSRF_BINDING_COOKIE_PATH"
            append_env AUTH_CSRF_HEADER_NAME "$AUTH_CSRF_HEADER_NAME"
            append_env AUTH_COOKIE_SAMESITE "$AUTH_COOKIE_SAMESITE"
            append_env AUTH_COOKIE_SECURE "${AUTH_COOKIE_SECURE:-true}"
            append_env AUDIT_TRANSACTIONAL_OUTBOX "${AUDIT_TRANSACTIONAL_OUTBOX:-true}"
            append_env AUDIT_OUTBOX_POLL_INTERVAL_MS "${AUDIT_OUTBOX_POLL_INTERVAL_MS:-500}"
            append_env AUDIT_OUTBOX_LOCK_TIMEOUT_MS "${AUDIT_OUTBOX_LOCK_TIMEOUT_MS:-30000}"
            append_env AUDIT_OUTBOX_MAX_ATTEMPTS "${AUDIT_OUTBOX_MAX_ATTEMPTS:-10}"
            append_env DB_MIGRATIONS_ENABLED "${DB_MIGRATIONS_ENABLED:-true}"
            append_env DB_MIGRATION_LOCK_TTL_MS "${DB_MIGRATION_LOCK_TTL_MS:-300000}"
            append_env DB_MIGRATION_WAIT_TIMEOUT_MS "${DB_MIGRATION_WAIT_TIMEOUT_MS:-60000}"
            append_env DB_MIGRATION_POLL_INTERVAL_MS "${DB_MIGRATION_POLL_INTERVAL_MS:-1000}"

            docker compose up --build -d
            docker image prune -f
        env:
          MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_DATABASE: ${{ secrets.MONGO_DATABASE }}
          MONGO_HOST: ${{ secrets.MONGO_HOST }}
          MONGO_PORT: ${{ secrets.MONGO_PORT }}
          MONGO_REPLICA_SET_NAME: ${{ secrets.MONGO_REPLICA_SET_NAME }}
          MONGO_REPLICA_SET_KEY: ${{ secrets.MONGO_REPLICA_SET_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: ${{ secrets.PORT }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          SWAGGER_ENABLED: ${{ secrets.SWAGGER_ENABLED }}
          AUTH_ACCESS_COOKIE_NAME: ${{ secrets.AUTH_ACCESS_COOKIE_NAME }}
          AUTH_REFRESH_COOKIE_NAME: ${{ secrets.AUTH_REFRESH_COOKIE_NAME }}
          AUTH_ACCESS_COOKIE_PATH: ${{ secrets.AUTH_ACCESS_COOKIE_PATH }}
          AUTH_REFRESH_COOKIE_PATH: ${{ secrets.AUTH_REFRESH_COOKIE_PATH }}
          AUTH_CSRF_SECRET: ${{ secrets.AUTH_CSRF_SECRET }}
          AUTH_CSRF_COOKIE_NAME: ${{ secrets.AUTH_CSRF_COOKIE_NAME }}
          AUTH_CSRF_COOKIE_PATH: ${{ secrets.AUTH_CSRF_COOKIE_PATH }}
          AUTH_CSRF_BINDING_COOKIE_NAME: ${{ secrets.AUTH_CSRF_BINDING_COOKIE_NAME }}
          AUTH_CSRF_BINDING_COOKIE_PATH: ${{ secrets.AUTH_CSRF_BINDING_COOKIE_PATH }}
          AUTH_CSRF_HEADER_NAME: ${{ secrets.AUTH_CSRF_HEADER_NAME }}
          AUTH_COOKIE_SAMESITE: ${{ secrets.AUTH_COOKIE_SAMESITE }}
          AUTH_COOKIE_SECURE: ${{ secrets.AUTH_COOKIE_SECURE }}
          AUDIT_TRANSACTIONAL_OUTBOX: ${{ secrets.AUDIT_TRANSACTIONAL_OUTBOX }}
          AUDIT_OUTBOX_POLL_INTERVAL_MS: ${{ secrets.AUDIT_OUTBOX_POLL_INTERVAL_MS }}
          AUDIT_OUTBOX_LOCK_TIMEOUT_MS: ${{ secrets.AUDIT_OUTBOX_LOCK_TIMEOUT_MS }}
          AUDIT_OUTBOX_MAX_ATTEMPTS: ${{ secrets.AUDIT_OUTBOX_MAX_ATTEMPTS }}
          DB_MIGRATIONS_ENABLED: ${{ secrets.DB_MIGRATIONS_ENABLED }}
          DB_MIGRATION_LOCK_TTL_MS: ${{ secrets.DB_MIGRATION_LOCK_TTL_MS }}
          DB_MIGRATION_WAIT_TIMEOUT_MS: ${{ secrets.DB_MIGRATION_WAIT_TIMEOUT_MS }}
          DB_MIGRATION_POLL_INTERVAL_MS: ${{ secrets.DB_MIGRATION_POLL_INTERVAL_MS }}

services:
  server:
    build: ./server
    restart: unless-stopped
    volumes:
      - ./server/uploads:/app/uploads
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: "node -e \"fetch('http://127.0.0.1:3000/api').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - campus

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=/api
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: "wget -q --spider http://127.0.0.1/ || exit 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - campus

  mongodb:
    image: mongo:7.0
    expose:
      - '27017'
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE}
    volumes:
      - ./data/db:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --host localhost --port 27017 -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 }).ok" | grep 1']
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - campus

networks:
  campus:
    driver: bridge
    
